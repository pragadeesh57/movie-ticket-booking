<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Select Seat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        .screen {
            background: #333;
            color: white;
            padding: 10px;
            margin: 20px auto;
            width: 80%;
        }

        .seats {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }

        .seat {
            padding: 12px;
            background: #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .seat:hover {
            background: #aaa;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + label {
            background: green;
            color: white;
        }

        .book-button {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="text"] {
            padding: 10px;
            width: 250px;
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎟️ Book Movie Ticket</h1>

    <h2 th:text="${movie.title}"></h2>

    <p>
        Language:
        <span th:text="${movie.language}"></span>
    </p>

    <p>
        Price:
        ₹<span th:text="${movie.price}"></span>
    </p>

    <div class="screen">
        SCREEN
    </div>

    <form action="/book" method="post">

        <input type="hidden"
               name="movieId"
               th:value="${movie.id}">

        <h3>Enter Your Name</h3>

        <input type="text"
               name="customerName"
               placeholder="Enter your name"
               required>

        <h3>Select Your Seat</h3>

        <div class="seats">

            <div>
                <input type="radio" id="A1" name="seatNumber" value="A1" required>
                <label class="seat" for="A1">A1</label>
            </div>

            <div>
                <input type="radio" id="A2" name="seatNumber" value="A2">
                <label class="seat" for="A2">A2</label>
            </div>

            <div>
                <input type="radio" id="A3" name="seatNumber" value="A3">
                <label class="seat" for="A3">A3</label>
            </div>

            <div>
                <input type="radio" id="A4" name="seatNumber" value="A4">
                <label class="seat" for="A4">A4</label>
            </div>

            <div>
                <input type="radio" id="A5" name="seatNumber" value="A5">
                <label class="seat" for="A5">A5</label>
            </div>

            <div>
                <input type="radio" id="B1" name="seatNumber" value="B1">
                <label class="seat" for="B1">B1</label>
            </div>

            <div>
                <input type="radio" id="B2" name="seatNumber" value="B2">
                <label class="seat" for="B2">B2</label>
            </div>

            <div>
                <input type="radio" id="B3" name="seatNumber" value="B3">
                <label class="seat" for="B3">B3</label>
            </div>

            <div>
                <input type="radio" id="B4" name="seatNumber" value="B4">
                <label class="seat" for="B4">B4</label>
            </div>

            <div>
                <input type="radio" id="B5" name="seatNumber" value="B5">
                <label class="seat" for="B5">B5</label>
            </div>

            <div>
                <input type="radio" id="C1" name="seatNumber" value="C1">
                <label class="seat" for="C1">C1</label>
            </div>

            <div>
                <input type="radio" id="C2" name="seatNumber" value="C2">
                <label class="seat" for="C2">C2</label>
            </div>

            <div>
                <input type="radio" id="C3" name="seatNumber" value="C3">
                <label class="seat" for="C3">C3</label>
            </div>

            <div>
                <input type="radio" id="C4" name="seatNumber" value="C4">
                <label class="seat" for="C4">C4</label>
            </div>

            <div>
                <input type="radio" id="C5" name="seatNumber" value="C5">
                <label class="seat" for="C5">C5</label>
            </div>

        </div>

        <br>

        <button type="submit" class="book-button">
            🎟️ Confirm Booking
        </button>

    </form>

</div>

</body>

</html>

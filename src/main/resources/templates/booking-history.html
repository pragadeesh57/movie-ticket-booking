<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Booking History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 Booking History</h1>

    <table>

        <tr>
            <th>Booking ID</th>
            <th>Customer Name</th>
            <th>Movie</th>
            <th>Seat</th>
            <th>Booking Date</th>
        </tr>

        <tr th:each="booking : ${bookings}">

            <td th:text="${booking.id}"></td>

            <td th:text="${booking.customerName}"></td>

            <td th:text="${booking.movie.title}"></td>

            <td th:text="${booking.seatNumber}"></td>

            <td th:text="${booking.bookingDate}"></td>

        </tr>

    </table>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>

</html>
